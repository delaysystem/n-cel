[package]
name = "n_cel_engine"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
cel = { version = "0.14.5", features = ["json", "chrono", "regex"] }
regex = { version = "1.10", default-features = false, features = ["std", "perf", "unicode"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
